name: Label Test Commands

# Generated by Achrobat/Achrobat-Label-Sync. Do not edit by hand: this file is overwritten on
# every distribution run. Commands are handled by the reusable workflow referenced below,
# so new commands apply automatically without this file being redistributed.

on:
  issue_comment:
    types:
      - created
      - edited
      - deleted

permissions:
  contents: read

jobs:
  label-test-command:
    if: ${{ github.event.issue.pull_request && github.event.comment.user.type != 'Bot' && startsWith(github.event.comment.body, '/') }}
    uses: Achrobat/Achrobat-Label-Sync/.github/workflows/label-test-command.yml@master
    with:
      label_sync_repository: Achrobat/Achrobat-Label-Sync
      label_sync_ref: master
    secrets: inherit
